<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuyu-tei Card Search — Vanguard prices, movers &amp; price lists</title>
    <meta
      name="description"
      content="Search all ~28,000 Cardfight!! Vanguard singles on Yuyu-tei in English: live prices and stock, price history, market movers and a price-list calculator."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151e28" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yuyu-tei Card Search" />
    <meta property="og:title" content="Yuyu-tei Card Search — Vanguard prices in English" />
    <meta
      property="og:description"
      content="Every Cardfight!! Vanguard single on Yuyu-tei: English names, live prices and stock, price history and market movers."
    />
    <meta property="og:url" content="https://yuyutei-vg-scraper.vercel.app/" />
    <meta property="og:image" content="https://yuyutei-vg-scraper.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved/OS theme before first paint so there's no flash of
      // the wrong theme. Mirrors src/theme.js — keep them in sync.
      (function () {
        try {
          var t = localStorage.getItem('yuyutei:theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
