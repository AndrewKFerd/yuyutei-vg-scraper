name: Update card catalog

# Runs the "quick" half of pipeline/ (catalog + official-name/skill lookup)
# on a schedule and commits the regenerated frontend/public/data/cards.json
# straight to main -- Vercel's GitHub integration then deploys that push
# automatically. This is what makes the site's data self-updating: nobody
# needs to run pipeline/build-data.js on their own machine and push the
# result by hand anymore.
#
# Deliberately NOT included here: pipeline/scrape-card-detail.js (the
# per-card Japanese skill-text scraper). It's a multi-hour, ~28k-request
# crawl with selectors that haven't been verified against real yuyu-tei
# markup yet (see that file's header) -- not something to run unattended on
# a recurring schedule until it's been checked. Run it manually when ready;
# build-data.js will pick up its output the next time this workflow (or a
# manual build) runs.

on:
  schedule:
    - cron: '0 18 * * *' # once a day; adjust as you like
  workflow_dispatch: {} # lets you trigger a run on demand from the Actions tab

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Scrape yuyu-tei catalog
        working-directory: pipeline
        run: node scrape-catalog.js

      - name: Scrape cf-vanguard official names/skill text
        working-directory: pipeline
        run: node scrape-cf-vanguard.js

      - name: Build frontend/public/data/cards.json
        working-directory: pipeline
        run: node build-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/cards.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update card catalog ($(date -u +%Y-%m-%d))"
            git push
          fi
